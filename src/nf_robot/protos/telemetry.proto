/*
Description of the wire format used when obsever sends robot state to a UI or web backend.
It's whatever the control_plane in the cloud needs to know or forward to drivers and spectators of a robot in order to render the web based interface.

Note that video streams are sent over a different protocol for efficiency even if some control signals about them are sent over this interface
*/

syntax = "proto3";

package nf.telemetry;

import "common.proto";

// estimate of the robot's position
message PositionEstimate {
  nf.common.Vec3 gantry_position = 1;
  nf.common.Vec3 gantry_velocity = 2;
  nf.common.Pose gripper_pose = 3; // in world space
  double data_ts = 4; // the wall time in seconds since the epoch UTC when the robot was at this position
  // an array of bools for each anchor. true meaning the line should be drawn with a droop
  repeated bool slack = 5;
  // Exact tension force on each of the four lines in newtons.
  repeated float tension = 6;
}

// Diagnostic information about factors used in estimating the robot's positon
message PositionFactors {
  // Visually determined (apriltags) position and velocity
  nf.common.Vec3 visual_pos = 1;
  nf.common.Vec3 visual_vel = 2;
  // Encoder determined position and velocity of hang point
  nf.common.Vec3 hanging_pos = 3;
  nf.common.Vec3 hanging_vel = 4;
  // z axis rotation of gripper frame relative to room frame
  float spin = 5;
}

// Individual sightings of the gantry by apriltag
message GantrySightings {
  repeated nf.common.Vec3 sightings = 1;
}

// Send by the observer to UIs when calibration or config file reading has set the anchor poses
message AnchorPoses {
  // Will either be four poses in order of anchor num (pilot anchors)
  // or two anchor poses (arpeggio anchors)
  repeated nf.common.Pose poses = 1;

  // when anchors are arpeggio type, two eyelet positions and tilts are also sent.
  repeated nf.common.Vec3 eyelets = 2;
  repeated float tilt = 3; // angle from horizontal in degrees of installed camera tilt adapters.

  // Saved swing cancellation latency to use with this robot. Not a camera pose, but part of the setup data.
  // used by UI to pre-set the saved value on the slider.
  float swing_latency = 4;

  nf.common.CalibratedStatus calibrated = 5;
}

enum ConnStatus {
  CONNSTATUS_NOT_DETECTED = 0;
  CONNSTATUS_CONNECTING = 1;
  CONNSTATUS_CONNECTED = 2;
}

enum MotorTorque {
  MOTORTORQUE_UNSPECIFIED = 0;
  MOTORTORQUE_ENABLED = 1;
  MOTORTORQUE_DISABLED = 2;
}

enum GripperModel {
  GRIPPERMODEL_PILOT = 0;
  GRIPPERMODEL_ARPEGGIO = 1;
}

// Update about the status of the connection between observer and a robot component such as an anchor or gripper
message ComponentConnStatus {
  bool is_gripper = 1;
  uint32 anchor_num = 2; // will be set only for anchors
  ConnStatus websocket_status = 3;
  ConnStatus video_status = 4;
  string ip_address = 5; // On the wifi network in the house where the robot is.
  optional GripperModel gripper_model = 6; // also set to communicate anchor type
  // Message with additional detail about why the component may not be functioning.
  optional string error_message = 7;
  // Tempurature of the Raspberry Pi SOC in degrees celcius
  optional float temp = 8;
  // Whether the motor on the component is enabled
  optional MotorTorque motor_enabled = 9;
}

// Info on the throughput and latency of video connections and apriltag processing
message VidStats {
  float detection_rate = 1; // tags detected per second summed accross all cameras
  float video_latency = 2; // seconds between when frames are captured and when the observer can process them.
  float video_framerate = 3; // average framerate across all cameras
}


// Position of a named object that UI might want to visually represent.
// only sent when it moves
message NamedObjectPosition {
  // if position is unset, the UI should hide the indicator. 
  optional nf.common.Vec3 position = 1;
  // Name of the object
  // Could be the name of a tag like 'hamper', 'gamepad', or 'parking_location'
  // When the observer is moving the gantry to a particular goal position, it gives this position with the name 'gantry_goal'
  string name = 2;

  // DEPRECATED
  // 3, 4 and 5
}

// When the gantry has been commanded to move it gives this velocity to the UI for visualization.
message CommandedVelocity {
  nf.common.Vec3 velocity = 1;
}

// The last commanded grip command sent to the gripper
message CommandedGrip {
  // commanded wrist speed.
  float wrist_speed = 1;

  // commanded finger speed
  float finger_speed = 2;
}

// A connected UI should immediately display this message in a popup
message Popup {
  string message = 1;

  // A unique identifier for this message
  // should be supplied when using buttons.
  // UI will respond with a PopupAck containing the id and the index of the button clicked
  optional uint32 id = 2;

  // A list of buttons to show below the message.
  // if empty, "OK" is shown
  repeated string buttons = 3;
}

// Latest state of sensors in the gripper
message GripperSensors {
  // measured laser range from palm to obstacle in meters. Unset when infinite
  float range = 1;

  // Finger angle from full open to full closed [-90,90]
  // In the pilot gripper this is the value last commanded of the finger servo.
  // In the arpeggio gripper, this is the last measured value
  // map this to [0,60] to get the angle in degrees of the first finger bone.
  // the second bone is a deterministic function of the first one, but I don't know the function.
  float angle = 2;

  // The force the fingers are feeling [0,1]
  float pressure = 3;

  // Wrist angle in degrees [0,1080]
  // If you are looking for angle of gripper camera relative to room, it's position_factors.spin
  float wrist = 4;

  // The target force the gripper is aiming for in constant force mode [0,1]
  optional float target_force = 5;
}

// values predicted by model using the gripper camera provided to UI for diagnostic visualization
message GripCamPredictions {
  // predicted vector to target (posiution of target)
  float move_x = 1;
  float move_y = 2;
  // probability a target is in view
  float prob_target_in_view = 3; 
  // probability an object is held in the gripper (visual only)
  float prob_holding = 4;
  // Predicted ideal grip angle from vertical in the image [0-pi]
  float grip_angle = 5;
}

enum TargetStatus {
  TARGETSTATUS_SEEN = 0;
  TARGETSTATUS_SELECTED = 1;
  TARGETSTATUS_PICKED_UP = 2;
  TARGETSTATUS_DROPPED = 3;
}

message OneTarget {
  // stable target identifier
  string id = 1;
  // position in world space
  nf.common.Vec3 position = 2;
  // intended dropoff location
  oneof dropoff {
    nf.common.Vec3 coords = 3;
    string tag = 4;
  }
  // status of target
  TargetStatus status = 5;
  // the entity that submitted the target to the observer.
  string source = 6;
}

// A full snapshot of the list of targets known to the observer and their statuses. replace previous
message TargetList {
  // order of targets is the order in which the observer will try to pick them up
  repeated OneTarget targets = 1;
}

// Indicates the availability of a video stream
message VideoReady {
  // is this the gripper camera?
  bool is_gripper = 1;

  // Camera anchor num if this is an anchor camera
  optional uint32 anchor_num = 2;

  // for local UI's connect at this address
  // udp:127.0.0.1:1234
  optional string local_uri = 3;

  // for remote UI's construct a url using this stream path
  // for example http://localhost:8889/${streamPath}/whep
  optional string stream_path = 4;

  // feed number, distinct from anchor num.
  // 0: gripper, 1: first preferred anchor, 2: 2nd preferred anchor, 3: reprojected floor image
  uint32 feed_number = 5;

  // tcp://host:port of the raw compressed-passthrough broadcast (see CompressedStreamer),
  // for LAN/same-machine consumers (e.g. a lerobot recording process) that want the
  // original video quality without a JPEG re-encode. Only set when stringman-headless was
  // started with a non-default --bind_address, since that's the only time this streamer
  // runs. UIs should keep using local_uri; this is for non-browser consumers.
  optional string compressed_uri = 6;
}

message UplinkStatus {
  bool online = 1;
}

// A driver "slot" is permission to actually use a driving access level right
// now, as opposed to merely holding it. Driving means a per-viewer WebRTC feed
// of every camera; a robot shared with everyone can have far more people
// entitled to drive than the media gateway can serve at once, so entitled
// drivers wait in line and watch the scalable HLS remux until a slot frees.
//
// Sent only from the control plane, and unlike every other telemetry item it is
// addressed to a single UI rather than broadcast to all of a robot's viewers:
// queue position and slot ownership are per-user. It is therefore never
// retained (a retained copy would be served to the wrong person on connect).
message DriverSlotStatus {
  // What the caller's permissions entitle them to:
  // "owner" | "full" | "limited_driver" | "spectator".
  string granted_level = 1;
  // What they may actually use at this moment: granted_level while they hold a
  // slot, "spectator" while they wait for one.
  string effective_level = 2;
  // True when this UI currently holds a slot.
  bool held = 3;
  // Slots this robot allows at once, and how many are taken.
  uint32 capacity = 4;
  uint32 in_use = 5;
  // 1-based place in line. 0 when holding a slot or not waiting for one.
  uint32 queue_position = 6;
  uint32 queue_length = 7;
  // Seconds without control input after which a held slot is handed on.
  uint32 idle_timeout_seconds = 8;
  // Seconds of that timeout left. 0 when not holding a slot.
  uint32 idle_seconds_remaining = 9;
}

// A message used by Stringman to give progress feedback to the UI on various operations
// such as calibration, firmware update, and anything else we need.
message OperationProgress {
  // from 0 to 100
  float percent_complete = 1;

  // Operation name
  string name = 2;

  // Extra message (what is happening right now)
  string current_action = 3;

  // When true, the UI hides the progress bar at 100% without the usual completion
  // popup. For routine operations the user did not explicitly ask for, such as a
  // model loading itself on first use.
  bool suppress_completion_popup = 4;
}

message SwingCancellationState {
  bool enabled = 1;
  string present = 2; // something must be present other than a boolean with a false value for the message to even exist.
}

message TensionRegulationState {
  bool enabled = 1;
  bool present = 2; // something must be present other than a boolean with a false value for the message to even exist.
}

// Whether the anchors are actively holding position. Reported by the anchors
// rather than inferred from the last command, since they drop torque on their
// own when a line goes over-tension.
message TorqueState {
  bool enabled = 1;
  bool present = 2; // something must be present other than a boolean with a false value for the message to even exist.
}

message AutoTargetingState {
  bool enabled = 1;
  bool present = 2; // something must be present other than a boolean with a false value for the message to even exist.
}

// Lists of anchors which can see specific tags.
// For now, only sent during first stage of calibration and only when something changes.
message VisibilityStates {
  // Anchors which can see the origin card. for example [0,2,3]
  repeated uint32 anchors_seeing_origin_card = 1;

  // Add other tag states if needed
}

message TaskStatus {
  optional string current_task_name = 1;

  optional nf.common.RoutePoint route_source = 2;
  optional nf.common.RoutePoint route_destination = 3;
}

// One or more log lines forwarded over telemetry
message Logs {
  repeated string line = 1;
}

// A single kind of update that the observer is providing to an external UI
// Typically about the robot's state such as it's position
message TelemetryItem {
  oneof payload {
    PositionEstimate pos_estimate = 1;
    PositionFactors pos_factors_debug = 2;
    GantrySightings gantry_sightings = 3;
    AnchorPoses new_anchor_poses = 4;
    ComponentConnStatus component_conn_status = 5;
    VidStats vid_stats = 6;
    NamedObjectPosition named_position = 7;
    CommandedVelocity last_commanded_vel = 8; // Total velocity considering all inputs including the swing cancellation, in the room's frame of reference
    CommandedVelocity raw_commanded_vel = 21; // "raw" commanded velocity whether from human or AI, where the lateral component is in the un-stabilized gripper image frame of reference
    Popup pop_message = 9;
    GripperSensors grip_sensors = 10;
    GripCamPredictions grip_cam_preditions = 11; // note misspelled. not changed for backwards compat
    TargetList target_list = 12;
    VideoReady video_ready = 13;
    UplinkStatus uplink_status = 15; // only sent from control plane
    nf.common.EpisodeControl episode_control = 16; // Forwarded
    OperationProgress operation_progress = 17;
    CommandedGrip last_commanded_grip = 18;
    SwingCancellationState swing_cancellation_state = 19;
    VisibilityStates visibility_states = 20;
    TaskStatus task_status = 22;
    Logs logs = 23;
    TensionRegulationState tension_regulation_state = 24;
    AutoTargetingState auto_targeting_state = 25;
    TorqueState torque_state = 26;
    DriverSlotStatus driver_slot_status = 27; // only sent from control plane, and only to one UI
  }

  // If set, the Control Plane will cache this item using this string as the key.
  // When a new UI connects, it receives the latest item for every unique key.
  // e.g., "anchor_poses", "conn_status_anchor_0", "conn_status_gripper"
  optional string retain_key = 14;
}

// the frame sent over the wire
message TelemetryBatchUpdate {
  string robot_id = 1;
  repeated TelemetryItem updates = 2;
}
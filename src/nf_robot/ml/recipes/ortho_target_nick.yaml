# Nick's room, held out of ortho_target.yaml so it can be the eval split for the
# ortho_target model: a room whose floor, lighting and object layouts the model has
# never seen. Same conversion and labelling as the training recipe, so the two
# distill into identically shaped samples.

# python src/nf_robot/ml/lerobot_build_dataset.py \
#     --recipe src/nf_robot/ml/recipes/ortho_target_nick.yaml \
#     --temp_dir /home/nhn/data_scratch \
#     --output_root /home/nhn/data_scratch/nick_ortho

output_repo_id: naavox/nick_ortho
camera_mode: ortho_512
center_crop: false
pad_clamp: false

merge:
  - naavox/move_clutter_nick_2
  - naavox/nick-clutter-aug3

drop_features:
  - anchor_poses

normalize_tasks: move_clutter_rect_tasks.yaml

label_contact_actions:
  enabled: true
  pressure_threshold: 0.1
  episode_end_seconds: 1.0
  blend_seconds: 0.5
  rotate_contact_vec: false

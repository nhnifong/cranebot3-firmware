# Dataset used as a source for both for visual servoing teleop mining and for ortho target
#
# python src/nf_robot/ml/lerobot_build_dataset.py \
#     --recipe src/nf_robot/ml/recipes/combined_targets.yaml \
#     --temp_dir /home/nhn/data_scratch \
#     --output_root /home/nhn/data_scratch/combined_targets \
#     --upload

output_repo_id: naavox/combined_targets
camera_mode: gripper_ortho
center_crop: false
pad_clamp: false

merge:
  - naavox/move_clutter_nick_2
  - justink04/laundry-in-hamper-7-19-26
  - justink04/laundry-in-hamper-7-23-26
  - justink04/trash-in-trashcan-7-23-26
  - justink04/trash-in-trashcan-7-24-26
  - justink04/laundry-in-hamper-8-1-26
  - repo_id: justink04/laundry-in-hamper2-8-1-26
    exclude_episodes: ["41-60"]
  - repo_id: justink04/laundry-in-hamper3-8-1-26
    exclude_episodes: ['48-99']
  - justink04/cranebot-ethernet-test-02
  - repo_id: justink04/laundry-in-hamper4-8-1-26
    exclude_episodes: [13]
  - naavox/nick-clutter-aug3
  - naavox/playroom-clutter-aug4
  - naavox/bedroom-laundry-aug5
  - naavox/playroom-aug6
  - naavox/bedroom-laundry-aug7-2
  - naavox/bedroom-laundry-Aug16
  - naavox/toys-79west
  - naavox/79west-toys-aug17
  - naavox/playroom-aug23
  - naavox/nick-aug23

# Exactly mine_teleop.STATE_NEEDED, and nothing else.
keep_state_features:
  - gripper_pos_x
  - gripper_pos_y
  - gripper_pos_z
  - spin
  - finger_angle
  - laser_rangefinder
  - finger_pressure
  - wrist_angle
  - target_force

# 6 of these 15 sources were recorded after the anchor_poses feature was added and carry
# their recorded calibration; the other 10 predate it. The merge demands identical
# feature sets and raises if they differ - after every source has been converted, which
# is hours of re-encoding to reach the failure. Nothing downstream of this recipe reads
# anchor_poses, so drop it everywhere rather than let the mismatch through.
drop_features:
  - anchor_poses

normalize_tasks: move_clutter_rect_tasks.yaml

# rotate_contact_vec must stay false: the ortho projection is defined in the room
# frame, and rotating contact_vec into the gripper's frame would put the labels in a
# space the floor view knows nothing about.
label_contact_actions:
  enabled: true
  pressure_threshold: 0.1
  episode_end_seconds: 1.0
  blend_seconds: 0.5
  rotate_contact_vec: false

# The eval half of combined_targets.yaml: the 79west room, held out whole.
#
# A room rather than a random sample of episodes. Consecutive episodes in one session
# share a floor and most of an object layout - the operator clearing one pile item by
# item - so a random split scores near duplicates and says nothing about a room the
# model has not seen. The merge renumbers episodes and forgets which source each came
# from, so the separation has to happen here, before the merge, or not at all.
#
# Every processing setting below is identical to combined_targets.yaml on purpose: the
# two datasets differ in which rooms they contain and in nothing else, or the eval score
# measures the difference in treatment as well as the difference in room.
#
# python src/nf_robot/ml/lerobot_build_dataset.py \
#     --recipe src/nf_robot/ml/recipes/combined_targets_eval.yaml \
#     --temp_dir /home/nhn/data_scratch \
#     --output_root /home/nhn/data_scratch/combined_targets_eval \
#     --upload

output_repo_id: naavox/combined_targets_eval
camera_mode: gripper_ortho
center_crop: false
pad_clamp: false

merge:
  # Add any new 79west sets here
  - naavox/toys-79west

# Exactly mine_teleop.STATE_NEEDED plus ortho_target.STATE_COMPONENTS, and nothing else.
keep_state_features:
  - gripper_pos_x
  - gripper_pos_y
  - gripper_pos_z
  - spin
  - finger_angle
  - laser_rangefinder
  - finger_pressure
  - wrist_angle
  - target_force

# Dropped for the same reason as in combined_targets.yaml, and because the two halves
# must end up with identical feature sets to be read by the same tools.
drop_features:
  - anchor_poses

normalize_tasks: move_clutter_rect_tasks.yaml

# rotate_contact_vec must stay false: the ortho projection is defined in the room
# frame, and rotating contact_vec into the gripper's frame would put the labels in a
# space the floor view knows nothing about.
label_contact_actions:
  enabled: true
  pressure_threshold: 0.1
  episode_end_seconds: 1.0
  blend_seconds: 0.5
  rotate_contact_vec: false

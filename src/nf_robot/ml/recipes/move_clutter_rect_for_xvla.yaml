# Merge the move_clutter datasets with Justin's laundry/trash datasets, convert to
# gripper_anchors_rect, trim observation.state to fit X-VLA's 20-wide proprio
# projection, canonicalize the speech-to-text task strings, label contact actions,
# and produce naavox/move_clutter_rect_for_xvla.
# This dataset contains the overhead cameras but not the warped floor composite.
# all frames have the same dimensions so they can be used with multitask dit
# prefer resize to center crop

# python src/nf_robot/ml/lerobot_build_dataset.py \
#     --recipe src/nf_robot/ml/recipes/move_clutter_rect_for_xvla.yaml \
#     --temp_dir /home/nick/data_scratch \
#     --output_root /home/nick/data_scratch/move_clutter_rect_for_xvla \
#     --upload

output_repo_id: naavox/move_clutter_rect_for_xvla
camera_mode: gripper_anchors_rect
center_crop: false
pad_clamp: true

merge:
  - repo_id: naavox/move_clutter
    exclude_episodes: ["289-325", "448-481"]
  - naavox/move_clutter_2
  - naavox/move_clutter_hawes_1
  - naavox/move_clutter_chuck_1
  - naavox/move_clutter_79west4
  - naavox/move_clutter_nick_2
  - justink04/laundry-in-hamper-7-19-26
  - justink04/laundry-in-hamper-7-23-26
  - justink04/trash-in-trashcan-7-23-26
  - justink04/trash-in-trashcan-7-24-26
  - justink04/laundry-in-hamper-8-1-26
  - repo_id: justink04/laundry-in-hamper2-8-1-26
    exclude_episodes: ["41-60"]
  - repo_id: justink04/laundry-in-hamper3-8-1-26
    exclude_episodes: ['48-99']
  - justink04/cranebot-ethernet-test-02

# 20 of the 44 recorded components. lerobot/xvla-base ships max_state_dim=20 (not
# the config class default of 32) and X-VLA's from_pretrained does a strict load,
# so anything wider means the proprio projection cannot load at all.
# Dropped: gripper_rot_0..5 (orientation is still carried by spin and
# wrist_angle), gantry_position_* (raw actuator space, redundant with
# gripper_pos_*), swing_cancellation_on (a control-mode flag the policy does not
# command), parking_location_*/gamepad_* bearings and distances (teleop-rig
# landmarks, not task targets), tension_0..3 (cable dynamics the policy does not
# command), and visual_pos_*/hang_pos_* (alternate estimates of a pose that
# gripper_pos_* already carries).
keep_state_features:
  - vel_x
  - vel_y
  - vel_z
  - wrist_speed
  - finger_speed
  - gripper_pos_x
  - gripper_pos_y
  - gripper_pos_z
  - spin
  - finger_angle
  - laser_rangefinder
  - finger_pressure
  - wrist_angle
  - target_force
  - hamper_bearing
  - hamper_distance
  - toybox_bearing
  - toybox_distance
  - trashcan_bearing
  - trashcan_distance

normalize_tasks: move_clutter_rect_tasks.yaml

label_contact_actions:
  enabled: true
  pressure_threshold: 0.1
  episode_end_seconds: 1.0
  blend_seconds: 0.5
  rotate_contact_vec: false

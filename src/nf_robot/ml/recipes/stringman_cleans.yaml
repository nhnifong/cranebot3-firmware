# The largest collection of Stringman teleoperation to date, shaped for end to end models.
#
# Same sources as grip_o: everything that went into combined_targets_reblend, plus every
# recording since. Unlike grip_o, this does not use the reblended dataset as a source. It
# goes back to the original recordings, because grip_o's form of them has already lost
# the anchor cameras and most of the state.
#
#   cameras  all_original: gripper 684x384 and both anchors 960x544, as recorded. Every
#            source is recorded at those sizes in AV1, so nothing is re-encoded. The ortho
#            floor view is dropped because it is synthesized, not seen.
#   state    20 of the 44 recorded observation.state components (see keep_state_features),
#            plus anchor_poses.
#   action   gripper_vel: the commanded gripper-frame velocity, wrist and finger speeds,
#            trimmed out of the recorded dual_vel_contact action.
#
# python src/nf_robot/ml/lerobot/build_dataset.py \
#     --recipe src/nf_robot/ml/recipes/stringman_cleans.yaml \
#     --temp_dir /home/nhn/data_scratch \
#     --output_root /home/nhn/data_scratch/stringman_cleans \
#     --upload --keep_intermediate --resume

output_repo_id: naavox/stringman_cleans
camera_mode: all_original
center_crop: false
pad_clamp: false

action_space: gripper_vel

merge:
  # --- the sources of combined_targets_reblend, with its episode selections ---
  # Recorded before the anchor_poses feature existed. Each one's anchor_config is used only
  # to backfill that feature (see backfill_anchor_poses below).

  - repo_id: justink04/laundry-in-hamper-7-19-26
    anchor_config: ../calibrations/justin.json

  - repo_id: justink04/laundry-in-hamper-7-23-26
    exclude_episodes: ["7"]
    anchor_config: ../calibrations/justin.json

  - repo_id: justink04/trash-in-trashcan-7-23-26
    anchor_config: ../calibrations/justin.json

  - repo_id: justink04/trash-in-trashcan-7-24-26
    anchor_config: ../calibrations/justin.json

  - repo_id: justink04/laundry-in-hamper-8-1-26
    anchor_config: ../calibrations/justin.json

  - repo_id: justink04/laundry-in-hamper3-8-1-26
    exclude_episodes: ['48-99']
    anchor_config: ../calibrations/justin.json

  - repo_id: justink04/cranebot-ethernet-test-02
    anchor_config: ../calibrations/justin.json

  - repo_id: justink04/laundry-in-hamper4-8-1-26
    exclude_episodes: [13]
    anchor_config: ../calibrations/justin.json

  - naavox/nick-clutter-aug3
  - naavox/playroom-clutter-aug4
  - naavox/bedroom-laundry-aug5
  - naavox/toys-79west
  - naavox/playroom-aug6
  - naavox/bedroom-laundry-aug7-2
  - naavox/bedroom-laundry-Aug16
  - naavox/79west-toys-aug17
  - naavox/playroom-aug23
  - naavox/nick-aug23
  - naavox/79west-stuff

  # --- recorded since combined_targets_reblend, as in grip_o ---
  - repo_id: naavox/chuck-aug28
    exclude_episodes: ['14']
  - naavox/79west-sep4
  - naavox/bedroom-sep6
  - naavox/playroom-sep10
  - naavox/nick-sep14
  - naavox/sep22-junk
  - naavox/james-sep22
  - naavox/79west-sep28
  - naavox/playroom-sep29-2
  - naavox/playroom-oct7
  - naavox/james-oct15
  - naavox/bedroom-oct15

# 20 wide, which fits every policy that caps state: g05 (20), wall_oss_05 (26), dm05 (32).
# Dropped from the recorded 44:
#   - the bearing/distance to all five named targets. toybox and trashcan are never
#     reported and sit at the room origin, parking_location mostly too, and hamper and
#     gamepad are missing in several rooms.
#   - gripper_rot_0..3. 0 and 3 are ~1.0 with no spread, 1 equals 2, and both are ~0;
#     the tilt is carried by rot_4 and rot_5.
#   - gantry_position_*, which is gripper_pos_* plus the pole.
#   - visual_pos_* and hang_pos_*, the position estimator's inputs (hang_pos jumps by
#     metres between frames).
#   - swing_cancellation_on, on in 99% of frames.
keep_state_features:
  - vel_x
  - vel_y
  - vel_z
  - wrist_speed
  - finger_speed
  - gripper_pos_x
  - gripper_pos_y
  - gripper_pos_z
  - gripper_rot_4
  - gripper_rot_5
  - spin
  - finger_angle
  - laser_rangefinder
  - finger_pressure
  - wrist_angle
  - target_force
  - tension_0
  - tension_1
  - tension_2
  - tension_3

# Only sources from aug3 on carry anchor_poses. The merge needs one feature set, so the
# older ones gain it from their anchor_config instead of the newer ones losing it.
backfill_anchor_poses: true

# anchor_cam_tilt is only recorded from aug28 on. aug3-aug23 carry neither the tilt nor a
# config to backfill it from. combined_targets_reblend recovered their tilts by matching
# the ortho re-render to the recorded ortho view, which would mean a reblend here just for
# a number. Drop it everywhere. This also keeps the backfill above from adding it to the
# config-carrying sources alone.
drop_features:
  - anchor_cam_tilt

# Contact labeling is left off: it would extend the action to gripper_vel_contact.

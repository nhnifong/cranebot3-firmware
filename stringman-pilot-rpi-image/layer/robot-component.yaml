# METABEGIN
# X-Env-Layer-Name: robot-component
# X-Env-Layer-Category: robot
# X-Env-Layer-Desc: Dependencies and setup for stringman robot component
# X-Env-Layer-Requires: trixie-minbase
# METAEND

mmdebstrap:
  packages:
    - build-essential
    # lgpio publishes wheels only up to cp312, and trixie is on python 3.13, so
    # pip falls back to its sdist -- which generates its C extension with SWIG.
    - swig
    - cloud-guest-utils
    - python3-dev
    - python3-venv
    - python3-picamera2
    - rpicam-apps
    - libzbar0
    - network-manager 
    - git
    - iw
    - wpasupplicant
    - libpam-systemd
    - polkitd
    - pkexec
    - i2c-tools
    - can-utils
  
  customize-hooks:
    - 'bash "${SRCROOT}/setup.sh" "$1"'
# METABEGIN
# X-Env-Layer-Name: robot-component
# X-Env-Layer-Category: robot
# X-Env-Layer-Desc: Dependencies and setup for stringman robot component
# X-Env-Layer-Requires: trixie-minbase
# METAEND

mmdebstrap:
  packages:
    - build-essential
    # Adafruit-Blinka pulls in lgpio, which publishes wheels only up to cp312
    # while trixie is on python 3.13. Pip therefore falls back to its sdist,
    # which needs SWIG to generate the wrapper and liblgpio to link against --
    # neither of which is in a minbase image. Installing Debian's build of the
    # same version instead satisfies the requirement outright (the venv is
    # created with --system-site-packages), so nothing has to be compiled.
    - python3-lgpio
    - cloud-guest-utils
    - python3-dev
    - python3-venv
    - python3-picamera2
    - rpicam-apps
    - libzbar0
    - network-manager 
    - git
    - iw
    - wpasupplicant
    - libpam-systemd
    - polkitd
    - pkexec
    - i2c-tools
    - can-utils
  
  customize-hooks:
    - 'bash "${SRCROOT}/setup.sh" "$1"'
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ortho target network</title>
<style>
  @page { size: landscape; margin: 0; }
  html, body { margin: 0; height: 100%; background: #fff; }
  body { display: flex; align-items: center; justify-content: center; }
  .frame { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #fff; }
  svg { display: block; width: 100%; height: 100%; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         fill: #000; }
  /* playback: sections stay hidden until spacebar reveals them in order */
  .sec { opacity: 0; transition: opacity 1s ease; }
  .sec.on { opacity: 1; }
</style>
</head>
<body>
<div class="frame">
  <svg id="d" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="16" markerHeight="16"
              markerUnits="userSpaceOnUse" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
      </marker>
    </defs>
    <rect width="1920" height="1080" fill="#fff"/>
  </svg>
</div>

<script>
// Layout is OrthoTargetNet in src/nf_robot/ml/ortho_target.py, at its defaults (3 attention layers).
const S = document.getElementById("d");
const NS = "http://www.w3.org/2000/svg";

const COLOR = {
  input:   "#00D1FF",
  state:   "#FF3DB4",
  frozen:  "#B866FF",
  trained: "#FFD400",
  head:    "#2EE86A",
  tensor:  "#FFFFFF",
  output:  "#FF7A00",
};

let parent = S;
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}

// A block: bold title plus optional detail lines, centred. "" in subs is a spacer.
function box(x, y, w, h, kind, title, subs = [], opt = {}) {
  const ts = opt.titleSize || 24, tl = opt.titleLine || 30;
  const ss = opt.subSize || 20, sl = opt.subLine || 25;
  el("rect", { x, y, width: w, height: h, rx: 12, fill: COLOR[kind],
               stroke: "#000", "stroke-width": kind === "tensor" ? 4 : 3,
               ...(opt.dashed ? { "stroke-dasharray": "12 8" } : {}) });
  const total = tl + sl * subs.length;
  let base = y + h / 2 - total / 2 + tl * 0.78;
  el("text", { x: x + w / 2, y: base, "text-anchor": "middle",
               "font-size": ts, "font-weight": 800 }, title);
  base += tl * 0.22;
  for (const s of subs) {
    base += sl;
    if (s) el("text", { x: x + w / 2, y: base - sl * 0.22, "text-anchor": "middle",
                        "font-size": ss, "font-weight": 600 }, s);
  }
}

function path(pts, head) {
  el("polyline", { points: pts.map(p => p.join(",")).join(" "), fill: "none",
                   stroke: "#000", "stroke-width": 3, "stroke-linejoin": "round",
                   ...(head ? { "marker-end": "url(#ah)" } : {}) });
}
const arrow = (...pts) => path(pts, true);
const line = (...pts) => path(pts, false);

function plus(cx, cy) {
  el("circle", { cx, cy, r: 18, fill: "#fff", stroke: "#000", "stroke-width": 3 });
  el("path", { d: `M${cx - 10},${cy} H${cx + 10} M${cx},${cy - 10} V${cy + 10}`,
               stroke: "#000", "stroke-width": 3.5 });
}

function label(x, y, text, anchor = "middle") {
  el("text", { x, y, "text-anchor": anchor, "font-size": 19, "font-weight": 800,
               "letter-spacing": "0.06em" }, text);
}

// Playback. section() starts a new group; everything drawn after it belongs to that group
// and stays invisible until spacebar reveals the groups one at a time, in order.
const sections = [];
let root = null;
function section() {
  root = root || parent;
  parent = root;
  parent = el("g", { class: "sec" });
  sections.push(parent);
}

// ---- title and key --------------------------------------------------------------
el("text", { x: 16, y: 60, "font-size": 44, "font-weight": 800 }, "Ortho target network");
[["input", "Input"], ["frozen", "Frozen · 86.6M"], ["trained", "Trained · 3.8M"],
 ["head", "Heads"], ["tensor", "Tensor"], ["output", "Output"]]
  .reduce((x, [k, t]) => {
    el("rect", { x, y: 34, width: 28, height: 28, rx: 5, fill: COLOR[k],
                 stroke: "#000", "stroke-width": k === "tensor" ? 4 : 3 });
    const label = el("text", { x: x + 38, y: 57, "font-size": 21, "font-weight": 700 }, t);
    return x + 38 + label.getComputedTextLength() + 40;
  }, 700);

// The diagram is shorter than the page; centre it under the title.
parent = el("g", { transform: "translate(0, 45)" });

// Five rows every column shares.
const SLOT = [150, 315, 480, 645, 810], SH = 120;
const mid = i => SLOT[i] + SH / 2;

// A column of blocks flowing downward, one per slot.
function column(x, w, blocks) {
  blocks.forEach(([slot, kind, title, subs], i) => {
    box(x, SLOT[slot], w, SH, kind, title, subs);
    if (i + 1 < blocks.length) arrow([x + w / 2, SLOT[slot] + SH], [x + w / 2, SLOT[blocks[i + 1][0]]]);
  });
}

// ---- input and backbone --------------------------------------------------------------
box(16, 150, 150, 180, "input", "Floor image", ["448 × 448", "5 m of room", "anchor cams", "warped flat"]);
section(); // 1: vision encoder
arrow([166, 210], [196, 210]);

box(196, 150, 160, 780, "frozen", "DINOv2",
    ["ViT-B/14", "with registers", "", "12 layers", "32×32 tokens", "14 px patches", "", "FROZEN", "86.6M params"],
    { titleSize: 36, titleLine: 46, subSize: 21, subLine: 32 });
arrow([356, 210], [386, 210]);
arrow([356, mid(4)], [386, mid(4)]);

box(386, SLOT[0], 170, SH, "tensor", "Patch tokens", ["last 4 layers", "3072 × 32 × 32"]);
box(386, SLOT[4], 170, SH, "tensor", "CLS vector", ["CLS + registers", "not used"], { dashed: true });

section(); // 2: stem and attention
arrow([556, 210], [596, 210]);

// ---- stem --------------------------------------------------------------------------------
label(681, 105, "STEM");
column(596, 170, [
  [0, "trained", "Conv 1×1", ["3072 → 256"]],
  [1, "trained", "GroupNorm", ["32 groups"]],
  [2, "trained", "GELU", []],
  [3, "trained", "+ Pos embed", ["learned", "1024 × 256"]],
]);

// ---- transformer block x3 ------------------------------------------------------------------
label(916, 105, "TRANSFORMER × 3");
el("rect", { x: 796, y: 135, width: 240, height: 805, rx: 16, fill: "none",
             stroke: "#000", "stroke-width": 3, "stroke-dasharray": "12 8" });
const TX = 836, TW = 160, TC = TX + TW / 2;
line([766, mid(3)], [781, mid(3)], [781, 125], [TC, 125]);
arrow([TC, 125], [TC, 150]);
box(TX, 150, TW, 50, "trained", "LayerNorm");
arrow([TC, 200], [TC, 244]);
box(TX, 244, TW, 100, "trained", "Self-attention", ["8 heads", "1024 tokens"]);
arrow([TC, 344], [TC, 388]);
arrow([816, 125], [816, 406], [TC - 18, 406]);        // residual
plus(TC, 406);
arrow([TC, 424], [TC, 468]);
line([TC + 18, 406], [1016, 406], [1016, 902]);
arrow([1016, 902], [TC + 18, 902]);                    // residual
box(TX, 468, TW, 50, "trained", "LayerNorm");
arrow([TC, 518], [TC, 562]);
box(TX, 562, TW, 70, "trained", "Linear", ["256 → 1024"]);
arrow([TC, 632], [TC, 676]);
box(TX, 676, TW, 50, "trained", "GELU");
arrow([TC, 726], [TC, 770]);
box(TX, 770, TW, 70, "trained", "Linear", ["1024 → 256"]);
arrow([TC, 840], [TC, 884]);
plus(TC, 902);

section(); // 3: upscale
arrow([TC, 920], [TC, 960], [1056, 960], [1056, 125], [1161, 125], [1161, 150]);

// ---- decoder --------------------------------------------------------------------------------
label(1161, 105, "DECODER · 1");
column(1076, 170, [
  [0, "trained", "Upsample ×2", ["bilinear"]],
  [1, "trained", "Conv 3×3", ["256 → 128"]],
  [2, "trained", "GroupNorm", ["32 groups"]],
  [3, "trained", "GELU", []],
  [4, "tensor", "Features", ["128 × 64 × 64"]],
]);
arrow([1246, mid(4)], [1266, mid(4)], [1266, 125], [1371, 125], [1371, 150]);

label(1371, 105, "DECODER · 2");
column(1286, 170, [
  [0, "trained", "Upsample ×2", ["bilinear"]],
  [1, "trained", "Conv 3×3", ["128 → 64"]],
  [2, "trained", "GroupNorm", ["32 groups"]],
  [3, "trained", "GELU", []],
  [4, "tensor", "Cell features", ["64 × 128 × 128", "3.9 cm each"]],
]);

section(); // 4: heads
// ---- heads and outputs --------------------------------------------------------------------
label(1571, 105, "HEADS");
label(1775, 105, "OUTPUTS");
line([1456, mid(4)], [1476, mid(4)], [1476, mid(1)]);
for (const [slot, ch, name, subs] of [
  [1, "64 → 1", "Objectness", ["128 × 128 cells", "sigmoid per cell"]],
  [3, "64 → 2", "Sub-cell offset", ["2 × 128 × 128", "in-cell x, y"]],
]) {
  arrow([1476, mid(slot)], [1496, mid(slot)]);
  box(1496, SLOT[slot], 150, SH, "head", "Conv 1×1", [ch]);
  arrow([1646, mid(slot)], [1676, mid(slot)]);
  box(1676, SLOT[slot], 198, SH, "output", name, subs);
  line([1874, mid(slot)], [1892, mid(slot)]);
}
arrow([1892, mid(1)], [1892, SLOT[4]]);
box(1496, SLOT[4], 408, SH, "output", "Targets",
    ["peaks over threshold + offset", "room x, y · any number"]);

document.addEventListener("keydown", e => {
  if (e.code !== "Space") return;
  e.preventDefault();
  if (e.repeat) return;
  const next = sections.find(g => !g.classList.contains("on"));
  if (next) next.classList.add("on");
});
</script>
</body>
</html>
